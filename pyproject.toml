[project]
name = "agent-pipeline-benchmark"
version = "0.1.0"
description = "Compares pipelines of coding agents, not models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
apb = "agent_pipeline_benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["toy-corpus"]
addopts = "-m 'not liubai' --cov=agent_pipeline_benchmark --cov-report=term-missing:skip-covered"
markers = [
    "liubai: contacts the live Aqueduct model and burns compute; run with -m liubai",
]

[tool.coverage.run]
source = ["agent_pipeline_benchmark"]

[tool.ty.src]
exclude = ["tests/toy-corpus"]
